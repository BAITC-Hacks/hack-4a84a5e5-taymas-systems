<!doctype html>
<html lang="ru" data-palette="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI Sana Challenge Hub{% endblock %}</title>
  <script>
    // Цветотип до первой отрисовки, чтобы страница не мигала другим цветом.
    try { var p = localStorage.getItem("aisana-palette"); if (p) document.documentElement.dataset.palette = p; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">AS</span><span>AI Sana <span class="brand-sub">Challenge Hub</span></span></a>
    <nav class="nav">
      <a href="/catalog">Каталог задач</a>
      <a class="cta" href="/business/new">Разместить задачу</a>
    </nav>
    <div class="palette" role="group" aria-label="Цветотип">
      <button type="button" class="swatch" data-p="night" aria-label="Цветотип «Ночь»" title="Ночь"><i style="background:#0d0d12"></i><i style="background:#d8ff3c"></i></button>
      <button type="button" class="swatch" data-p="berry" aria-label="Цветотип «Ягода»" title="Ягода"><i style="background:#fff0f4"></i><i style="background:#ff2e63"></i></button>
      <button type="button" class="swatch" data-p="electro" aria-label="Цветотип «Электро»" title="Электро"><i style="background:#eceeff"></i><i style="background:#3b30ff"></i></button>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  {% set ai_label = ai_status() %}
  <footer class="footer">
    <span>TayMas Systems · HackAlem AI 2026</span>
    <span class="ai{% if ai_label.startswith('заглушка') %} ai-fallback{% endif %}">режим ИИ: {{ ai_label }}</span>
  </footer>
</body>
</html>
